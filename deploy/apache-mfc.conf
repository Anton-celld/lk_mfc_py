# «Услуги МФЦ» работают через шлюз платформы: шлюз находит сервис mfc по ui_url=/mfc/ из Consul, проверяет сессию кабинета
# и роль svc-mfc и не даёт открыть страницу отдельной вкладкой. Apache только пересылает путь /mfc/ шлюзу.
# Добавьте в VirtualHost сайта кабинета рядом с остальными сервисами. Модули: proxy, proxy_http, headers (a2enmod ...).
# Шлюзу задайте TRUST_PROXY_HOPS=1, чтобы он видел адрес пользователя, а не Apache.
# Билет входа передаётся в заголовке Authorization, а не в адресе, поэтому в журналы доступа он не попадает.
# Пересылайте на шлюз только /api/ и интерфейсы сервисов, но не весь сайт: на корне шлюза есть служебные адреса (/metrics, /services).
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"

<Location "/mfc/">
    ProxyPass        "http://127.0.0.1:8000/mfc/"
    ProxyPassReverse "http://127.0.0.1:8000/mfc/"
</Location>
